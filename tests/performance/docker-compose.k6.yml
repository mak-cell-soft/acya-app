version: '3.8'

services:
  # Base de données InfluxDB pour recevoir les métriques k6 en temps réel
  influxdb:
    image: influxdb:1.8
    container_name: acya-k6-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    volumes:
      - influxdb-data:/var/lib/influxdb

  # Grafana avec dashboard k6 pré-configuré
  grafana:
    image: grafana/grafana:10.2.0
    container_name: acya-k6-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb

  # Runner k6
  k6:
    image: grafana/k6:latest
    container_name: acya-k6-runner
    environment:
      - K6_ENV=local
      - K6_TENANT=socofeb
    volumes:
      - ./k6:/scripts
    network_mode: "host" # Permet d'accéder facilement à localhost:8080 (API ACYA)
    entrypoint: ["k6", "run", "--out", "influxdb=http://localhost:8086/k6", "/scripts/scenarios/01_smoke.js"]

volumes:
  influxdb-data:
