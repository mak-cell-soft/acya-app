version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wood-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wood-app-db}
      APP_DB: ${APP_DB:-app-db-bo}
      PGDATA: /var/lib/postgresql/data/pgdata
#    ports:
#      - "5432:5432"
    volumes:
      # 1 - This is my old DB
      #- ./wood-app.api/postgres-data:/var/lib/postgresql/data
      # 2 - This is my DB for Ahmed Ayed's updates
      #- ./wood-app.api/postgres-data-new_for_ahmed:/var/lib/postgresql/data
      # 3 - This is my DB new DB after my changes on 2026/04/22
      - ./wood-app.api/postgres-data-new_2026_04_22:/var/lib/postgresql/data
      - ./wood-app.api/db:/docker-entrypoint-initdb.d:ro
    networks:
      - wood-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wood-app-db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # .NET Web API
  api:
    build:
      context: ./wood-app.api
      dockerfile: Dockerfile
    container_name: wood-app-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__WoodAppContextConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-wood-app-db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};
      - ConnectionStrings__AppContextConnection=Host=postgres;Port=5432;Database=${APP_DB:-app-db-bo};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};
      - MultiTenancy__Enabled=true
      - ConnectionStrings__MasterConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-wood-app-db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};
      - TokenKey=${JWT_SECRET_MAIN}
      - JWTSettings__securityKey=${JWT_SECRET_MAIN}
      - JWTSettings__ValidAudience=https://acya.site
      - JWTSettings__ValidIssuer=https://acya.site/api/
      - AllowedOrigins=https://acya.site;https://www.acya.site;https://migration.acya.site
      - SmtpSettings__Server=${SMTP_SERVER:-smtp.gmail.com}
      - SmtpSettings__Port=${SMTP_PORT:-587}
      - SmtpSettings__SenderName=${SMTP_SENDER_NAME:-ACYA Notification}
      - SmtpSettings__SenderEmail=${SMTP_SENDER_EMAIL}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Tej__Username=${TEJ_USERNAME}
      - Tej__Password=${TEJ_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wood-app-network

  # Migration UI (React migration)
  migration-ui:
    build:
      context: ./elance-app.ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://acya.site/api/
    container_name: migration-ui
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://acya.site/api/
    ports:
      - "5000:3000"
    depends_on:
      - api
    networks:
      - wood-app-network

  # Backoffice ASP.NET Core API
  admin-api:
    build:
      context: ./bo-acya-app/admin-elance-back
      dockerfile: Dockerfile
    container_name: admin-elance-back
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MasterConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-wood-app-db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};
      - JwtSettings__Secret=${JWT_SECRET_ADMIN}
      - JwtSettings__Issuer=acya-bo
      - JwtSettings__Audience=acya-bo-ui
      - JwtSettings__ExpirationInMinutes=1440
      - ClientJwtSettings__Secret=${JWT_SECRET_MAIN}
      - MailgunSettings__WebhookSigningKey=${MAILGUN_WEBHOOK_SIGNING_KEY}
      - MigrationScriptPath=/app/db/FullDb_Migration/full_migration.sql
      - N8nEmailService__BaseUrl=http://n8n:5678
      - N8nEmailService__ApiKey=${N8N_EMAIL_SERVICE_API_KEY}
    ports:
      - "8082:80"
    volumes:
      - ./wood-app.api/db:/app/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wood-app-network

  # Backoffice Next.js Frontend
  admin-ui:
    build:
      context: ./bo-acya-app/admin-elance-front
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://admin.acya.site/api/
    container_name: admin-elance-front
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://admin.acya.site/api/
      - BACKEND_INTERNAL_URL=http://admin-api:80/api/
    ports:
      - "5002:3000"
    depends_on:
      - admin-api
    networks:
      - wood-app-network

networks:
  wood-app-network:
    driver: bridge
